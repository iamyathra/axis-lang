<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A - single embedded AXIS component</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f8; color: #111; }
  header, footer { padding: 24px 32px; }
  main { max-width: 640px; margin: 0 auto; padding: 0 32px 48px; }
  #hero { margin-top: 16px; }
</style>
</head>
<body>
<header><h1>Ordinary HTML page</h1><p>Everything outside the box below is plain HTML - no AXIS involved.</p></header>
<main>
  <p>This paragraph, this list, and the header/footer are normal DOM the host page owns:</p>
  <ul><li>Host item one</li><li>Host item two</li></ul>
  <div id="hero"></div>
</main>
<footer><p>End of host page.</p></footer>

<script type="module">
  import { mount } from "/src/mount.js";

  const source = await (await fetch("./hero.ax")).text();
  const instance = await mount(document.getElementById("hero"), source, {
    inputs: { title: "Embedded in plain HTML", intensity: 0.8 },
  });
  window.__axisInstance = instance; // for the verification script only
</script>
</body>
</html>
